<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة التربية الإسلامية</title>
  <style>/* styles/tokens.css */
/* Design tokens: palette matches the existing grade-5 game ("لعبة الخامس - الأسابيع 1-3"). */
:root {
  --ind: #2A1D66;
  --pur: #5B3FC4;
  --cyan: #2FA9CC;
  --orange: #F28C28;
  --green: #1E9E5A;
  --red: #D93B41;
  --yellow: #FFC83D;
  --light: #EEF2FF;
  --txt: #1F2340;
  --text-muted: #5B6478;

  --tap: 56px;              /* minimum touch target: students tap the projected screen */
  --font: "Segoe UI", Tahoma, Arial, sans-serif;  /* ships with Windows, covers Arabic: no web fonts */
  --fs-body: clamp(16px, 1.4vw, 22px);
  --fs-big: clamp(26px, 3vw, 44px);
}
</style>
  <style>/* styles/main.css */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font);
  font-size: var(--fs-body);
  color: #fff;
  background: radial-gradient(circle at 30% 10%, #3A2B85, var(--ind)) fixed;
  min-height: 100vh;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;       /* no double-tap zoom on the touchscreen */
  -webkit-tap-highlight-color: transparent;  /* the :active feedback below replaces the browser flash */
}
input { -webkit-user-select: text; user-select: text; }
/* English runs inside Arabic text (wrapped by UI.watchBidi): keep each one whole and left-to-right. */
bdi { display: inline-block; direction: ltr; }
button { font: inherit; cursor: pointer; border: 0; color: inherit; background: none; }
button:disabled { opacity: .4; cursor: default; }
h1, h2, h3, p { margin: 0; }
a { color: inherit; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 12px;
  padding: 10px 18px;
  background: rgba(20, 12, 60, .88);
}
.brand { font-weight: 900; font-size: 1.25em; white-space: nowrap; }
.tabs { display: flex; gap: 8px; flex: 1; justify-content: center; }
.tab { min-height: var(--tap); padding: 0 26px; border-radius: 999px; background: rgba(255,255,255,.12); font-weight: 800; font-size: 1.05em; }
.tab.active { background: var(--yellow); color: var(--ind); }
.tools { display: flex; gap: 6px; }
.icon-btn { width: var(--tap); height: var(--tap); border-radius: 50%; background: rgba(255,255,255,.12); font-size: 1.3em; }

#view { padding: 18px clamp(12px, 2vw, 28px) 48px; max-width: 1600px; margin: 0 auto; }

/* ---------- generic ---------- */
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.center { justify-content: center; }
.center-text { text-align: center; }
.muted { opacity: .8; font-size: .95em; }
.btn {
  min-height: var(--tap); padding: 0 22px; border-radius: 18px;
  background: var(--pur); color: #fff; font-weight: 800;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  text-decoration: none;
}
.btn.ghost { background: rgba(255,255,255,.14); }
.btn.green { background: var(--green); }
.btn.danger { background: var(--red); }
.btn.yellow { background: var(--yellow); color: var(--ind); }
.btn.big { min-height: 72px; font-size: 1.25em; padding: 0 34px; border-radius: 22px; }
/* touch feedback: every tappable element shrinks and darkens while pressed (no hover-only cues anywhere) */
:is(button, a, .btn, .tab, .ctab, .icon-btn, .gtile, .ltile, .atile, .pick-g, .turn, .check, .choice, .chip, .fig, .mc, .modal-x):not(:disabled):not(.soon):active {
  transform: scale(.96); filter: brightness(.92);
}
.pill { background: rgba(255,255,255,.14); border-radius: 999px; padding: 6px 16px; font-weight: 800; white-space: nowrap; }

@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(10px); } 75% { transform: translateX(-10px); } }
@keyframes pulse { 50% { transform: scale(1.04); } }

/* ---------- scoreboard: classes page (#scoreboard) and class page (#scoreboard/<classId>) ---------- */
.ctab { min-height: var(--tap); min-width: 70px; border-radius: 999px; background: rgba(255,255,255,.14); font-weight: 900; font-size: 1.1em; padding: 0 14px; direction: ltr; }
.ctab.active { background: var(--yellow); color: var(--ind); }

.grade-sec { margin-bottom: 26px; }
.grade-title { font-size: clamp(24px, 2.8vw, 36px); font-weight: 900; margin-bottom: 12px; border-inline-start: 12px solid var(--gc); padding-inline-start: 12px; }
.class-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
.class-card {
  background: #fff; color: var(--txt); border-radius: 26px; border-top: 12px solid var(--gc);
  box-shadow: 0 10px 28px rgba(0,0,0,.3); min-height: 180px; padding: 18px 12px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
}
.cc-id { font-size: clamp(40px, 4.5vw, 64px); font-weight: 900; color: var(--ind); line-height: 1; }
.cc-pts { font-size: clamp(30px, 3vw, 44px); font-weight: 900; color: var(--gc); line-height: 1; }
.cc-pts small { font-size: 16px; color: var(--text-muted); margin-inline-start: 6px; }

.class-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.class-title { font-size: clamp(36px, 5vw, 64px); font-weight: 900; margin: 0; }

.group-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.gcard {
  background: #fff; color: var(--txt); border-radius: 26px; padding: 16px;
  border-top: 12px solid var(--gc); box-shadow: 0 10px 28px rgba(0,0,0,.3);
  display: flex; flex-direction: column; gap: 10px;
}
.gcard-top { display: flex; align-items: center; gap: 12px; }
.g-emoji { font-size: 64px; line-height: 1; }
.g-name { font-size: 1.5em; font-weight: 900; }
.g-points { text-align: center; font-size: clamp(64px, 9vw, 96px); font-weight: 900; color: var(--gc); line-height: 1; }
.g-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: auto; }
.pbtn {
  min-height: 96px; border-radius: 22px; background: var(--gc); color: #fff;
  font-size: 2.4em; font-weight: 900; box-shadow: 0 6px 0 rgba(0,0,0,.22);
  text-shadow: 0 2px 4px rgba(0,0,0,.35);
}
.pbtn.minus { background: var(--red); }
.pbtn:active { transform: translateY(4px); box-shadow: none; }

.pop {
  position: fixed; z-index: 60; pointer-events: none; direction: ltr;
  font-weight: 900; font-size: 56px; color: var(--yellow);
  text-shadow: 0 3px 10px rgba(0,0,0,.5);
  transform: translate(-50%, -50%);
  animation: floatUp 1s forwards;
}
@keyframes floatUp { to { transform: translate(-50%, -170%); opacity: 0; } }

.earned { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.earn-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--light); border-radius: 16px; padding: 10px 14px; border-inline-start: 8px solid var(--gc); font-size: 1.15em; }
.earn-row .em { font-size: 1.5em; }

/* colored tiles and bars carry white text: a soft shadow keeps it readable on orange and cyan */
.gtile, .unit-head, .atile, .pick-g { text-shadow: 0 2px 4px rgba(0, 0, 0, .35); }

/* ---------- layers & modals ---------- */
.layer { position: fixed; inset: 0; z-index: 40; }
.modal-layer { background: rgba(20, 12, 60, .82); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.modal {
  position: relative; background: #fff; color: var(--txt);
  border-radius: 28px; padding: 28px clamp(18px, 3vw, 36px);
  width: min(640px, 100%); max-height: 92vh; overflow: auto;
  box-shadow: 0 12px 40px rgba(0,0,0,.4);
}
.modal.wide { width: min(1000px, 100%); }
.modal h2 { font-size: clamp(24px, 3vw, 38px); color: var(--ind); margin-bottom: 14px; text-align: center; padding: 0 40px; }
.modal-x { position: absolute; top: 12px; inset-inline-end: 12px; width: var(--tap); height: var(--tap); border-radius: 50%; background: var(--light); color: var(--ind); font-size: 22px; }
.modal .btn.ghost { background: var(--light); color: var(--ind); }

#toast {
  position: fixed; bottom: 24px; left: 50%; z-index: 80;
  transform: translate(-50%, 200%); transition: transform .3s;
  background: var(--yellow); color: var(--ind); font-weight: 900; font-size: 1.2em;
  padding: 14px 28px; border-radius: 999px; box-shadow: 0 8px 24px rgba(0,0,0,.35);
  max-width: 90vw; text-align: center;
}
#toast.on { transform: translate(-50%, 0); }

/* settings */
.set-sec { border-top: 2px solid var(--light); padding: 16px 0; display: flex; flex-direction: column; gap: 10px; }
.set-sec h3 { color: var(--ind); }
.in { min-height: 50px; border-radius: 12px; border: 2px solid #D6DAEE; padding: 0 12px; font: inherit; flex: 1; color: var(--txt); }
.in.emoji { flex: none; width: 76px; text-align: center; font-size: 1.4em; }

/* ---------- activities: hub / grade / lesson ---------- */
.page-title { font-size: clamp(28px, 4vw, 52px); font-weight: 900; margin: 4px 0 18px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.grade-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
.gtile {
  border-radius: 28px; padding: 30px 18px; color: #fff; text-align: center; text-decoration: none;
  background: var(--tc); box-shadow: 0 10px 30px rgba(0,0,0,.35);
  display: flex; flex-direction: column; gap: 6px; align-items: center;
}
.gtile .ic { font-size: clamp(60px, 8vw, 100px); line-height: 1.1; }
.gtile b { font-size: clamp(26px, 3vw, 40px); }
.gtile.soon { filter: grayscale(.7); opacity: .6; }
.soon-tag { background: rgba(0,0,0,.25); border-radius: 999px; padding: 4px 14px; font-weight: 800; }

.unit { margin-bottom: 28px; }
.unit-head { display: flex; align-items: center; gap: 12px; background: var(--uc); border-radius: 22px; padding: 12px 20px; margin-bottom: 12px; font-weight: 900; font-size: clamp(20px, 2.6vw, 32px); }
.unit-head small { font-weight: 700; opacity: .85; font-size: .6em; }
.lesson-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.ltile {
  background: #fff; color: var(--txt); border-radius: 22px; padding: 16px; text-decoration: none;
  display: flex; flex-direction: column; gap: 6px; border-top: 8px solid var(--uc); min-height: 160px;
}
.ltile .n { width: 42px; height: 42px; border-radius: 50%; background: var(--uc); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; }
.ltile b { font-size: 1.2em; color: var(--ind); }
.ltile small { color: var(--text-muted); }
.ltile .acts { margin-top: auto; font-size: 1.4em; letter-spacing: 4px; }
.ltile.soon { opacity: .55; }

.info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; margin-bottom: 22px; }
.info { background: #fff; color: var(--txt); border-radius: 22px; padding: 18px 20px; }
.info h3 { color: var(--ind); margin-bottom: 10px; }
.info ul { margin: 0; padding-inline-start: 22px; display: flex; flex-direction: column; gap: 6px; }
.vocab { display: flex; flex-direction: column; gap: 8px; }
.vocab div { background: var(--light); border-radius: 14px; padding: 8px 12px; }
.vocab b { color: var(--pur); }
.section-title { font-size: clamp(22px, 2.8vw, 34px); font-weight: 900; margin: 6px 0 12px; }
.act-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.atile {
  border-radius: 26px; padding: 22px; color: #fff; text-align: center; background: var(--ac);
  box-shadow: 0 10px 26px rgba(0,0,0,.3);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 190px;
}
.atile .ic { font-size: 66px; line-height: 1.1; }
.atile b { font-size: 1.35em; }
.atile span { opacity: .9; }

/* ---------- player (full-screen game) ---------- */
.player { background: radial-gradient(circle at 30% 20%, #3A2B85, var(--ind)); display: flex; flex-direction: column; z-index: 30; }
.p-hud { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
.p-title { flex: 1; text-align: center; font-weight: 900; font-size: clamp(20px, 2.6vw, 32px); }
.turns { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; padding: 0 16px 12px; }
.turns-label { font-weight: 900; font-size: 1.15em; margin-inline-end: 8px; }
.turn {
  min-height: 60px; padding: 0 16px; border-radius: 999px; background: rgba(255,255,255,.12);
  display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.1em;
  border: 3px solid transparent; opacity: .75; transition: transform .15s;
}
.turn .em { font-size: 1.5em; }
.turn .tally { direction: ltr; background: rgba(0,0,0,.2); border-radius: 999px; padding: 2px 10px; font-size: .85em; }
.turn.on { background: var(--gc); border-color: #fff; opacity: 1; box-shadow: 0 0 0 5px var(--yellow); }
.pill-pts { margin-inline-start: auto; background: var(--green); color: #fff; border-radius: 999px; padding: 2px 14px; font-weight: 900; direction: ltr; }
/* answer / pause popup: a compact bar at the bottom (about a third of the screen at most) so the
   question and the green right answer stay visible above it. The layer only dims the bottom edge. */
.p-pop { position: absolute; inset: 0; z-index: 5; display: flex; align-items: flex-end; justify-content: center; padding: 0 12px 12px; background: linear-gradient(to top, rgba(20, 12, 60, .5), rgba(20, 12, 60, 0) 60%); }
.p-pop-card { background: #fff; color: var(--txt); border-radius: 24px; padding: 14px 20px; width: min(1100px, 100%); max-height: 40vh; overflow-y: auto; box-shadow: 0 -6px 24px rgba(0,0,0,.35); display: flex; flex-direction: column; gap: 10px; text-align: center; }
.pop-top { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px 16px; }
.pop-verdict { font-size: clamp(24px, 2.8vw, 36px); font-weight: 900; color: var(--ind); line-height: 1.2; }
.pop-verdict.ok { color: var(--green); }
.pop-verdict.no { color: var(--red); }
.pop-credit { background: var(--gc); color: #fff; border-radius: 999px; padding: 6px 18px; font-size: clamp(18px, 1.9vw, 24px); font-weight: 900; white-space: nowrap; }
.p-pop-card .why { background: #FFF6DB; color: #7A5200; font-size: clamp(16px, 1.6vw, 20px); line-height: 1.4; padding: 8px 14px; border-radius: 14px; }
.pop-row { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 10px; }
.pop-ask { font-weight: 900; font-size: 1.1em; color: var(--ind); }
.pop-groups { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.pop-groups .turn { min-height: var(--tap); padding: 0 16px; font-size: 1.05em; color: #fff; background: var(--gc); opacity: .6; }
.pop-groups .turn.on { opacity: 1; }
.pop-row .btn.big { min-height: 64px; font-size: 1.15em; padding: 0 28px; border-radius: 18px; }
/* while the popup is open, the quiz moves to the top and its verdict line (the popup says it) is hidden,
   so the question and the choices (with the green right answer) are not covered */
.player.paused .quiz { margin: 4px auto 0; gap: 12px; }
.player.paused .quiz-q { font-size: clamp(22px, 2.8vw, 36px); padding: 14px 20px; }
.player.paused .quiz-foot { display: none; }
/* taps on game controls are ignored while an answer/pause popup is pending or open (no double answers) */
.player.paused .p-body button { pointer-events: none; }
.player.paused .sort-item { animation-play-state: paused !important; }
/* keep the whole textbook screenshot visible above the popup */
.player.paused .hs-wrap { align-items: flex-start; }
.player.paused .p-body .hs-stage img { max-height: max(200px, calc(100vh - 480px)); }
.p-body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 16px 16px; overflow: auto; }

.pick { margin: auto; text-align: center; width: min(1150px, 100%); display: flex; flex-direction: column; gap: 18px; }
.pick h2 { font-size: clamp(30px, 4.4vw, 56px); }
.pick-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
.pick-g {
  min-height: 130px; border-radius: 24px; background: var(--gc); color: #fff;
  font-size: 1.45em; font-weight: 900; box-shadow: 0 8px 22px rgba(0,0,0,.3);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
}
.pick-g .em { font-size: 56px; line-height: 1.1; }

.result { margin: auto; background: #fff; color: var(--txt); border-radius: 28px; padding: 30px; text-align: center; width: min(700px, 100%); display: flex; flex-direction: column; gap: 14px; align-items: center; }
.result h2 { color: var(--ind); font-size: clamp(30px, 4vw, 52px); }
.result .stars-big { font-size: clamp(54px, 8vw, 96px); letter-spacing: 8px; }
.result .score { font-size: clamp(26px, 3.4vw, 44px); font-weight: 900; color: var(--ind); }
.result .btn.ghost { background: var(--light); color: var(--ind); }

/* hands-on step viewer */
.steps { margin: auto; width: min(1150px, 100%); display: flex; flex-direction: column; gap: 18px; }
.step-goal { text-align: center; font-size: clamp(20px, 2.6vw, 32px); font-weight: 800; }
.step-card { background: #fff; color: var(--txt); border-radius: 28px; padding: clamp(20px, 3vw, 40px); display: flex; gap: 22px; align-items: flex-start; min-height: 280px; }
.step-num { flex: none; width: clamp(70px, 8vw, 110px); height: clamp(70px, 8vw, 110px); border-radius: 50%; background: var(--orange); color: #fff; font-size: clamp(34px, 5vw, 60px); font-weight: 900; display: flex; align-items: center; justify-content: center; }
.step-text { font-size: clamp(24px, 3.4vw, 46px); font-weight: 800; line-height: 1.55; color: var(--ind); }
.step-tip { margin-top: 16px; background: #FFF6DB; color: #7A5200; border-radius: 16px; padding: 12px 16px; font-size: clamp(17px, 2vw, 26px); line-height: 1.5; }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
.step-dots { display: flex; justify-content: center; gap: 8px; }
.step-dots i { width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,.3); }
.step-dots i.on { background: var(--yellow); }
.step-nav { display: flex; justify-content: space-between; gap: 12px; }
.check-list { display: flex; flex-direction: column; gap: 10px; }
.check { min-height: 72px; border-radius: 20px; background: #fff; color: var(--ind); font-size: clamp(20px, 2.6vw, 32px); font-weight: 800; text-align: start; padding: 10px 20px; display: flex; gap: 14px; align-items: center; }
.check.on { background: #E6F6EC; color: var(--green); }
.challenge { background: rgba(255, 200, 61, .2); border: 3px dashed var(--yellow); border-radius: 20px; padding: 14px 18px; font-size: clamp(18px, 2.2vw, 28px); font-weight: 700; }

/* ---------- games ---------- */
.game { flex: 1; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.game-top { display: flex; justify-content: center; gap: 12px; }

/* quiz */
.quiz { margin: auto; width: min(1200px, 100%); display: flex; flex-direction: column; gap: 18px; }
.g-progress { text-align: center; font-weight: 800; opacity: .85; }
.quiz-q { background: #fff; color: var(--ind); border-radius: 26px; padding: 24px; font-size: clamp(24px, 3.4vw, 46px); font-weight: 900; text-align: center; line-height: 1.5; }
.quiz-em { display: block; font-size: 1.6em; }
.quiz-choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.choice { min-height: 84px; border-radius: 22px; background: var(--pur); color: #fff; font-size: clamp(20px, 2.6vw, 34px); font-weight: 800; padding: 12px 18px; line-height: 1.4; box-shadow: 0 6px 0 rgba(0,0,0,.25); }
.choice:nth-child(2) { background: var(--cyan); }
.choice:nth-child(3) { background: var(--orange); }
.choice:nth-child(4) { background: var(--green); }
.choice:disabled { opacity: 1; cursor: default; }
.quiz-choices.answered .choice:not(.ok):not(.no) { opacity: .4; }
.choice.ok { background: var(--green); box-shadow: 0 0 0 6px #7CF0A9; }
.choice.no { background: var(--red); animation: shake .4s; }
.quiz-foot { display: flex; flex-direction: column; align-items: center; gap: 10px; min-height: 90px; }
.verdict { font-size: clamp(24px, 3vw, 40px); font-weight: 900; }
.why { background: rgba(255,255,255,.12); padding: 10px 18px; border-radius: 16px; font-size: 1.1em; text-align: center; }

/* sort */
.sort-arena { position: relative; flex: 1; min-height: 230px; border-radius: 26px; background: rgba(255,255,255,.06); overflow: hidden; }
.sort-item {
  position: absolute; left: 50%; top: -30%; transform: translateX(-50%);
  background: #fff; color: var(--ind); border-radius: 24px; padding: 14px 28px;
  font-size: clamp(22px, 3.2vw, 42px); font-weight: 900; text-align: center;
  box-shadow: 0 8px 24px rgba(0,0,0,.35); max-width: 92%;
}
.sort-item .em { display: block; font-size: 1.7em; line-height: 1.1; }
.sort-item.falling { animation: fall linear forwards; }
@keyframes fall { from { top: -12%; } to { top: 100%; } }
.sort-item.hit-ok { background: #C9F2D9; }
.sort-item.hit-no { background: #FFD1D3; }
.sort-bins { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 14px; height: clamp(120px, 22vh, 180px); }
.bin { border-radius: 26px; background: var(--bc); color: #fff; font-size: clamp(18px, 2.8vw, 36px); font-weight: 900; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 4px dashed rgba(255,255,255,.6); padding: 6px; line-height: 1.25; }
.bin-em { font-size: 1.4em; }
.bin:active { transform: scale(.97); }
.bin.flash-ok { box-shadow: 0 0 0 8px #7CF0A9; }
.bin.flash-no { box-shadow: 0 0 0 8px #FF8A8F; }

/* memory */
.mem-board { flex: 1; display: grid; grid-template-columns: repeat(var(--cols), 1fr); grid-auto-rows: 1fr; gap: 14px; min-height: 320px; }
.mc { perspective: 900px; padding: 0; min-height: 90px; }
.mc .in { position: relative; display: block; width: 100%; height: 100%; transition: transform .45s; transform-style: preserve-3d; }
.mc.flip .in { transform: rotateY(180deg); }
.mc .back, .mc .front { position: absolute; inset: 0; border-radius: 20px; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px; font-weight: 900; }
.mc .back { background: linear-gradient(135deg, var(--pur), #7B61E0); color: #fff; font-size: clamp(34px, 5vw, 60px); box-shadow: 0 6px 16px rgba(0,0,0,.3); }
.mc .front { transform: rotateY(180deg); background: #fff; font-size: clamp(16px, 2.2vw, 28px); line-height: 1.35; }
.mc .front.sa { color: var(--pur); border: 5px solid var(--pur); }
.mc .front.sb { color: #136B85; border: 5px solid var(--cyan); }
.mc.done .front { background: #E6F6EC; border-color: var(--green); color: #145A36; }

/* order */
.order-prompt { text-align: center; font-size: clamp(20px, 2.6vw, 32px); font-weight: 800; background: rgba(255,255,255,.1); border-radius: 18px; padding: 10px 16px; }
.order-cols { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; min-height: 0; }
.order-slots, .order-pool { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.slot { flex: 1; min-height: 52px; display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.08); border: 3px dashed rgba(255,255,255,.35); border-radius: 18px; padding: 6px 12px; font-size: clamp(16px, 2vw, 26px); font-weight: 800; }
.slot .num { width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center; font-weight: 900; flex: none; }
.slot.filled { background: #fff; color: var(--ind); border: 3px solid var(--green); }
.slot.filled .num { background: var(--green); color: #fff; }
.slot.hint { border-color: var(--yellow); animation: pulse .5s 2; }
.chip { flex: 1; min-height: 56px; border-radius: 18px; background: #fff; color: var(--ind); font-size: clamp(16px, 2.1vw, 28px); font-weight: 800; padding: 8px 16px; box-shadow: 0 5px 0 rgba(0,0,0,.25); }
.chip.used { visibility: hidden; }
.chip.shake { animation: shake .4s; background: #FFD1D3; }
.order.blocks .chip, .block { background: var(--bc); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.3); }
.block { display: inline-block; border-radius: 10px; padding: 6px 16px; }

/* hotspot: textbook screenshot with invisible tap areas */
.hs-prompt { text-align: center; font-size: clamp(22px, 3vw, 40px); font-weight: 900; background: #fff; color: var(--ind); border-radius: 20px; padding: 12px 18px; }
.hs-prompt b { color: var(--orange); }
.hs-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.hs-stage { position: relative; display: inline-block; border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 8px 26px rgba(0,0,0,.35); }
.hs-stage img { display: block; max-width: 100%; max-height: calc(100vh - 210px); }
.turns ~ .p-body .hs-stage img { max-height: calc(100vh - 300px); }
.hs { position: absolute; border-radius: 8px; background: transparent; border: 0; padding: 0; cursor: pointer; }
.hs:active { background: rgba(255, 200, 61, .25); }
.hs.found { box-shadow: inset 0 0 0 5px var(--green); background: rgba(30, 158, 90, .15); }
.hs.wrong { box-shadow: inset 0 0 0 5px var(--red); background: rgba(217, 59, 65, .15); animation: shake .35s; }
/* The label is sized to its own tap area (container query on .hs): long labels wrap inside the area;
   a very narrow column (e.g. the thin "الخلفيات" column) shows just a big check mark instead of overflowing. */
.hs { container-type: size; }
.hs-tag { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--green); color: #fff; font-weight: 900; border-radius: 14px; padding: 4px 12px; font-size: clamp(14px, 1.4vw, 19px); line-height: 1.25; width: max-content; max-width: 100cqw; text-align: center; z-index: 2; direction: rtl; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
@container (max-width: 90px) {
  .hs-tag { font-size: 0; padding: 4px 6px; }
  .hs-tag::before { content: '✔'; font-size: 22px; }
}

/* textbook figures */
.figs { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-bottom: 22px; }
.fig { background: #fff; color: var(--txt); border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 8px; text-align: center; }
.fig img { width: 100%; height: 170px; object-fit: contain; }
.fig span { font-weight: 700; color: var(--ind); }
.lightbox figure { margin: 0; max-width: 96vw; max-height: 94vh; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.lightbox img { max-width: 96vw; max-height: 84vh; background: #fff; border-radius: 14px; }
.lightbox figcaption { color: #fff; font-size: 1.3em; font-weight: 800; }
.q-img { display: block; max-width: 100%; max-height: 32vh; margin: 12px auto 0; border-radius: 12px; }
.step-img { display: block; max-width: 100%; max-height: 42vh; margin-top: 16px; border-radius: 14px; border: 2px solid var(--light); cursor: zoom-in; }
.step-card > div { min-width: 0; flex: 1; }
.answer-img { max-width: 100%; max-height: 34vh; border-radius: 14px; border: 3px solid var(--light); }

@media (max-width: 760px) {
  .order-cols { grid-template-columns: 1fr; }
  .tabs .tab { padding: 0 14px; }
  .brand { display: none; }
}

/* ✏️ content editor (teacher): edit any lesson text; saved edits live in state.edits */
.editor-layer { display: flex; flex-direction: column; background: var(--ind); }
.ed-tools { display: flex; gap: 12px; align-items: center; padding: 0 16px 12px; flex-wrap: wrap; }
.ed-tools .in { flex: 1; min-width: 260px; }
.ed-body { background: var(--ind); }
.ed-group { background: #fff; color: var(--txt); border-radius: 16px; margin: 0 0 14px; padding: 6px 16px 12px; }
.ed-group summary { font-size: 1.25em; font-weight: 900; color: var(--ind); cursor: pointer; padding: 10px 0; min-height: 56px; display: flex; align-items: center; }
.ed-row { border-top: 2px dashed var(--light); padding: 10px 0; display: flex; flex-direction: column; gap: 6px; }
.ed-label { font-weight: 800; color: var(--ind); font-size: .95em; }
.ed-tag { background: var(--yellow); color: var(--ind); border-radius: 10px; padding: 1px 10px; font-size: .9em; }
.ed-ta { width: 100%; min-height: 56px; border-radius: 12px; border: 2px solid #D6DAEE; padding: 10px 12px; font: inherit; color: var(--txt); resize: vertical; overflow: hidden; background: #FBFBFE; }
.ed-changed .ed-ta { border-color: var(--yellow); background: #FFF9E8; }
.ed-changed .ed-label { color: #8A6400; }
.ed-revert { align-self: flex-start; min-height: 48px; }
.ed-row [data-revert] { flex: none; }
</style>
</head>

  <script>/* js/ui.js */
// Small DOM helpers shared by every view and game engine.
window.UI = (function () {
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ESC[c]);

  function shuffle(list) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Full-screen layer appended to <body>; returns { el, close }.
  function layer(className, onClose) {
    const el = document.createElement('div');
    el.className = 'layer ' + (className || '');
    document.body.appendChild(el);
    let closed = false;
    const close = () => {
      if (closed) return;
      closed = true;
      el.remove();
      if (onClose) onClose();
    };
    return { el, close };
  }

  // White dialog box. innerHtml must already be escaped. [data-close] elements close it.
  function modal(innerHtml, opts = {}) {
    const { el, close } = layer('modal-layer', opts.onClose);
    el.innerHTML = `<div class="modal ${opts.wide ? 'wide' : ''}">
      <button class="modal-x" data-close aria-label="إغلاق">✕</button>${innerHtml}</div>`;
    el.addEventListener('click', (e) => {
      if (e.target === el || e.target.closest('[data-close]')) close();
    });
    return { el, close };
  }

  function confirmBox(messageHtml, okLabel, onOk, danger) {
    const m = modal(`<h2>${messageHtml}</h2>
      <div class="row center">
        <button class="btn big ${danger ? 'danger' : 'green'}" data-ok>${okLabel}</button>
        <button class="btn big ghost" data-close>إلغاء</button>
      </div>`);
    m.el.querySelector('[data-ok]').onclick = () => { m.close(); onOk(); };
  }

  let toastTimer;
  function toast(text) {
    let t = document.getElementById('toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = text;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('on'), 3000);
  }

  // Floating "+3" over an element.
  function pop(anchor, text) {
    if (!anchor) return;
    const r = anchor.getBoundingClientRect();
    const p = document.createElement('div');
    p.className = 'pop';
    p.textContent = text;
    p.style.left = r.left + r.width / 2 + 'px';
    p.style.top = r.top + r.height / 2 + 'px';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1000);
  }

  // Textbook figure by id: embedded data URI in the built file, file path in dev (src/index.html).
  const img = (id) => (window.IMAGES && window.IMAGES[id]) || `assets/textbook/${id}.jpg`;

  // Full-screen view of a textbook figure; tap anywhere to close.
  function lightbox(id, caption) {
    const { el, close } = layer('modal-layer lightbox');
    el.innerHTML = `<figure><img src="${img(id)}" alt="">${caption ? `<figcaption>${esc(caption)}</figcaption>` : ''}</figure>`;
    el.onclick = close;
  }

  // English runs (Scratch block names like "set rotation style left-right") inside Arabic text get
  // scrambled by the bidi algorithm. Wrap each Latin run in <bdi> so it reads left-to-right.
  const LATIN = /[A-Za-z][A-Za-z0-9\s.,:%()'’\-⚑…!?/]*[A-Za-z0-9)%…!]|[A-Za-z]/g;
  const SKIP = 'bdi, .ltr, script, style, textarea, input, [dir="ltr"]';
  function isolateLatin(node) {
    if (node.nodeType === Node.TEXT_NODE) {
      const parent = node.parentElement;
      if (!parent || parent.closest(SKIP) || !/[A-Za-z]/.test(node.data)) return;
      const frag = document.createDocumentFragment();
      let last = 0;
      node.data.replace(LATIN, (m, at) => {
        if (at > last) frag.appendChild(document.createTextNode(node.data.slice(last, at)));
        const b = document.createElement('bdi');
        b.textContent = m;
        frag.appendChild(b);
        last = at + m.length;
      });
      if (last < node.data.length) frag.appendChild(document.createTextNode(node.data.slice(last)));
      node.replaceWith(frag);
    } else if (node.nodeType === Node.ELEMENT_NODE && !node.matches(SKIP)) {
      [...node.childNodes].forEach(isolateLatin);
    }
  }
  function watchBidi(root) {
    isolateLatin(root);
    new MutationObserver((muts) => muts.forEach((m) => m.addedNodes.forEach(isolateLatin)))
      .observe(root, { childList: true, subtree: true });
  }

  return { esc, shuffle, layer, modal, confirmBox, toast, pop, img, lightbox, watchBidi };
})();
</script>

// The only module that touches localStorage. Shape: docs/data-schema.md ("Saved state").
window.STORE = (function () {
  const KEY = 'cdash-islamic:state';
  const SCHEMA_VERSION = 2;

  function blank() {
    // v2: added `edits` — the ✏️ content-editor overlay ({ hash: { orig, text } }), see js/editor.js.
    return { schemaVersion: SCHEMA_VERSION, currentClass: null, classes: {}, settings: { muted: false }, edits: {} };
  }

  // Returns a complete state object, or null when `state` is not a dashboard save.
  function migrate(state) {
    if (!state || typeof state !== 'object' || !state.classes || typeof state.classes !== 'object') return null;
    // Add steps here when SCHEMA_VERSION changes.
    const base = blank();
    return { ...base, ...state, settings: { ...base.settings, ...state.settings } };
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      return (raw && migrate(JSON.parse(raw))) || blank();
    } catch (e) {
      console.warn('Could not read saved state', e);
      return blank();
    }
  }

  let warned = false;
  function save(state) {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      console.warn('Could not save state', e);
      if (!warned && window.UI) window.UI.toast('âڑ ï¸ڈ ط§ظ„ط­ظپط¸ ظ…ط¹ط·ظ‘ظ„ ظپظٹ ظ‡ط°ط§ ط§ظ„ظ…طھطµظپط­. طµط¯ظ‘ط± ظ†ط³ط®ط© ظ…ظ† âڑ™ï¸ڈ ظ‚ط¨ظ„ ط§ظ„ط¥ط؛ظ„ط§ظ‚.');
      warned = true;
    }
  }

  function exportBackup(state) {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `classroom-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function importBackup(file) {
    return file.text().then((text) => {
      const state = migrate(JSON.parse(text));
      if (!state) throw new Error('Not a dashboard backup file');
      save(state);
      return state;
    });
  }

  return { load, save, exportBackup, importBackup };
})();

  <script>/* js/editor.js */
// ✏️ Content editor: fix typos in any lesson text without touching the data files.
// Edits are stored in state.edits as an overlay keyed by a content hash of the ORIGINAL string
// ({ "<hash>": { orig, text } }), so they survive curriculum reordering and ride along with
// Export/Import backups. editor.apply() swaps the strings into window.CURRICULUM at boot.
window.EDITOR = (function () {
  const EDITABLE = new Set(['title', 'subtitle', 'term', 'meaning', 'caption', 'q', 'why', 'text',
    'a', 'b', 'prompt', 'goal', 'challenge', 'label', 'emoji', 'tip',
    // keys whose ARRAY items are plain editable strings:
    'choices', 'objectives', 'checklist', 'items']);
  // Never edit these (identity, structure, engine wiring).
  const FORBIDDEN = new Set(['id', 'type', 'img', 'image', 'answerImg', 'icon', 'color', 'box', 'bin', 'target', 'style', 'seconds']);

  // Two FNV-1a rounds with different seeds (~64 bits) → base36 code. Sync + collision-safe at our scale.
  function fnv(str, seed) {
    let h = seed >>> 0;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return h;
  }
  function hash(str) {
    return (fnv(str, 0x811c9dc5).toString(36) + fnv(str, 0x01935271).toString(36) + '_' + str.length).slice(0, 20);
  }
  const edits = () => (window.APP.state.edits = window.APP.state.edits || {});

  // key = the object key this node came from; array items keep their parent key so plain strings
  // (choices, objectives, checklist, order items) are patchable.
  function applyTo(node, key) {
    if (typeof node === 'string') {
      if (key && EDITABLE.has(key) && !FORBIDDEN.has(key)) {
        const e = edits()[hash(node)];
        if (e && e.text) return e.text;
      }
      return node;
    }
    if (Array.isArray(node)) { node.forEach((v, i) => { node[i] = applyTo(v, key); }); return node; }
    if (node && typeof node === 'object') {
      for (const k of Object.keys(node)) node[k] = applyTo(node[k], k);
    }
    return node;
  }
  // Apply saved edits to a fresh deep clone of the pristine curriculum (never mutate the original —
  // the editor and commit() need the untouched original strings as hash keys). Repeatable + idempotent.
  let pristine = null;
  function apply() {
    if (!pristine) pristine = window.CURRICULUM;
    const clone = typeof structuredClone === 'function'
      ? structuredClone(pristine)
      : JSON.parse(JSON.stringify(pristine));
    window.CURRICULUM_PRISTINE = pristine;
    window.CURRICULUM = applyTo(clone);
  }

  function commit(orig, text) {
    const E = edits();
    const h = hash(orig);
    const clean = text.trim();
    if (!clean || clean === orig) delete E[h];
    else E[h] = { orig, text: clean };
    window.APP.save();
    apply();
  }
  const count = () => Object.keys(edits()).length;

  // ---------- editor page ----------
  function open() {
    const { esc } = window.UI;
    const { el, close } = window.UI.layer('editor-layer', () => window.APP.refresh());
    let query = '';

    // Structured rows: { label, orig, cur, changed } grouped under Arabic section titles.
    function rows() {
      const groups = [];
      let g = null;                      // current lesson's row list (add() fills it)
      const add = (label, orig) => {
        if (typeof orig !== 'string' || !orig) return;
        const e = edits()[hash(orig)];
        g.push({ label, orig, cur: e && e.text ? e.text : orig, changed: !!(e && e.text && e.text !== orig) });
      };
      const editKey = (orig) => { const e = edits()[hash(orig)]; return e && e.text ? e.text : orig; };
      // list from the PRISTINE data: orig stays the textbook string even after patches are applied
      for (const grade of Object.values(window.CURRICULUM_PRISTINE || window.CURRICULUM || {})) {
        for (const unit of grade.units || []) {
          for (const lesson of unit.lessons || []) {
            g = [];
            add('عنوان الدرس', lesson.title);
            if (lesson.subtitle) add('العنوان الفرعي', lesson.subtitle);
            (lesson.objectives || []).forEach((o, i) => add(`الهدف ${i + 1}`, o));
            (lesson.vocabulary || []).forEach((v, i) => { add(`المصطلح ${i + 1}`, v.term); add(`شرح المصطلح ${i + 1}`, v.meaning); });
            (lesson.figures || []).forEach((f, i) => add(`تعليق صورة الكتاب ${i + 1}`, f.caption));
            (lesson.activities || []).forEach((a, ai) => {
              const head = `النشاط ${ai + 1}: ${editKey(a.title)}`;
              add(`عنوان ${head}`, a.title);
              (a.questions || []).forEach((q, qi) => {
                add(`${head} — نص السؤال ${qi + 1}`, q.q);
                (q.choices || []).forEach((c, ci) => add(`${head} — خيار ${qi + 1}.${ci + 1}`, c));
                if (q.why) add(`${head} — شرح إجابة السؤال ${qi + 1}`, q.why);
              });
              (a.bins || []).forEach((b, bi) => add(`${head} — سلة ${bi + 1}`, b.label));
              (a.items || []).forEach((it, ii) => {
                add(`${head} — عنصر ${ii + 1}`, typeof it === 'string' ? it : it.text);
                if (typeof it === 'object' && it.emoji) add(`${head} — رمز عنصر ${ii + 1}`, it.emoji);
              });
              (a.pairs || []).forEach((p, pi) => { add(`${head} — بطاقة أ (زوج ${pi + 1})`, p.a); add(`${head} — بطاقة ب (زوج ${pi + 1})`, p.b); });
              if (a.prompt) add(`${head} — التعليمات`, a.prompt);
              for (const ar of Object.values(a.areas || {})) add(`${head} — منطقة: ${editKey(ar.label)}`, ar.label);
              (a.tasks || []).forEach((t, ti) => { if (t.prompt) add(`${head} — تعليمة ${ti + 1}`, t.prompt); });
            });
            if (lesson.handsOn) {
              const h = lesson.handsOn;
              add('التطبيق العملي — الهدف', h.goal);
              (h.steps || []).forEach((s, si) => { add(`خطوة تطبيق ${si + 1}`, s.text); if (s.tip) add(`تلميح الخطوة ${si + 1}`, s.tip); });
              (h.checklist || []).forEach((c, ci) => add(`بند التحقق ${ci + 1}`, c));
              if (h.challenge) add('تحدٍّ إضافي', h.challenge);
            }
            groups.push({ group: `🎓 ${grade.title} › ${unit.title} › ${lesson.title}`, rows: g });
          }
        }
      }
      return groups;
    }

    function rowHtml(r, k) {
      const match = !query || r.orig.includes(query) || r.cur.includes(query) || r.label.includes(query);
      if (!match) return '';
      return `<div class="ed-row ${r.changed ? 'ed-changed' : ''}" data-k="${k}">
        <div class="ed-label">${esc(r.label)} ${r.changed ? '<span class="ed-tag">مُعدّل</span>' : ''}</div>
        <textarea class="ed-ta" data-orig="${esc(r.orig)}" rows="1">${esc(r.cur)}</textarea>
        ${r.changed ? `<button class="btn ghost ed-revert" data-revert>↩ استرجاع الأصل</button>` : ''}
      </div>`;
    }

    function render() {
      const groups = rows();
      let k = 0;
      const total = count();
      el.innerHTML = `<header class="p-hud">
          <button class="btn ghost" data-exit>✕ تم</button>
          <div class="p-title">✏️ تعديل نصوص الدروس</div>
          <span></span>
        </header>
        <div class="ed-tools">
          <input class="in" id="ed-search" placeholder="🔎 ابحث عن النص الذي تريد تصحيحه…" value="${esc(query)}">
          ${total ? `<button class="btn danger" data-clear>🗑 حذف كل التعديلات (${total})</button>` : '<span class="muted">التعديلات تُحفظ تلقائيًا وتُصدَّر مع النسخة الاحتياطية.</span>'}
        </div>
        <main class="p-body ed-body">${groups.map((g) => {
          const body = g.rows.map((r) => rowHtml(r, k++)).join('');
          return body ? `<details open class="ed-group"><summary>${esc(g.group)}</summary>${body}</details>` : '';
        }).join('') || '<p class="muted">لا نتائج للبحث.</p>'}</main>`;

      const search = el.querySelector('#ed-search');
      search.oninput = () => { query = search.value.trim(); render(); };

      el.querySelectorAll('.ed-ta').forEach((ta) => {
        const grow = () => { ta.style.height = 'auto'; ta.style.height = Math.max(56, ta.scrollHeight) + 'px'; };
        grow();
        let timer;
        ta.addEventListener('input', () => {
          grow();
          clearTimeout(timer);
          timer = setTimeout(() => commit(ta.dataset.orig, ta.value), 500);
        });
        ta.addEventListener('blur', () => { clearTimeout(timer); commit(ta.dataset.orig, ta.value); });
      });
      el.querySelectorAll('[data-revert]').forEach((b) => {
        b.onclick = () => { const ta = b.parentElement.querySelector('.ed-ta'); commit(ta.dataset.orig, ''); render(); };
      });
      const clear = el.querySelector('[data-clear]');
      if (clear) clear.onclick = () => window.UI.confirmBox(`حذف كل التعديلات (${count()}) وارجاع النصوص الأصلية؟`, 'نعم، احذف', () => {
        window.APP.state.edits = {};
        window.APP.save();
        apply();
        render();
      }, true);
      el.querySelector('[data-exit]').onclick = () => { window.APP.save(); close(); };
    }
    render();
  }

  return { apply, open, count };
})();
</script>

// Celebrations: 8-bit style game sounds (Web Audio, no audio files) and a canvas confetti burst.
window.FX = (function () {
  const api = { muted: false };
  let ctx;

  function context() {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    return ctx;
  }

  // Oscillator note; f1 (optional) sweeps the pitch to that frequency over the note's length.
  function osc(type, f0, f1, start, dur, vol) {
    const c = context();
    const t0 = c.currentTime + start;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0);
    o.stop(t0 + dur);
  }

  // Short burst of white noise (the "hit" crunch).
  function noise(start, dur, vol) {
    const c = context();
    const t0 = c.currentTime + start;
    const buf = c.createBuffer(1, Math.floor(c.sampleRate * dur), c.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource();
    const g = c.createGain();
    src.buffer = buf;
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(g).connect(c.destination);
    src.start(t0);
    src.stop(t0 + dur);
  }

  // Each step: [type, startFreq, endFreq (0 = no sweep), start s, length s, volume]. type 'noise' ignores freqs.
  const SOUNDS = {
    // +1: coin pickup, two fast rising square notes
    point: [['square', 988, 0, 0, 0.07, 0.09], ['square', 1319, 0, 0.07, 0.2, 0.09]],
    // -1: hurt, fast falling sawtooth sweep with a crunch
    minus: [['sawtooth', 900, 120, 0, 0.25, 0.08], ['noise', 0, 0, 0, 0.12, 0.1]],
    // -1 at zero: tiny low blip
    blocked: [['triangle', 150, 0, 0, 0.08, 0.18]],

      vy: -Math.random() * 18 - 6,

// quiz: one question at a time, big tap-able answers. Data: { questions: [{ q, choices, answer, emoji?, img?, why? }] }
window.GAMES.register('quiz', {
  icon: '❓',
  label: 'سؤال وجواب',
  render(root, act, done, ctx) {
    const { esc, shuffle } = window.UI;
    // Shuffle questions and choices; two-choice (✓/✗) questions keep their order.
    const qs = shuffle(act.questions).map((q) => {
      if (q.choices.length <= 2) return q;
      const order = shuffle(q.choices.map((_, i) => i));
      return { ...q, choices: order.map((i) => q.choices[i]), answer: order.indexOf(q.answer) };
    });
    let i = 0;
    let score = 0;

    function show() {
      const q = qs[i];
      root.innerHTML = `<div class="quiz">
        <div class="g-progress">السؤال ${i + 1} من ${qs.length} · ⭐ ${score}</div>
        <div class="quiz-q">${q.emoji && !q.img ? `<span class="quiz-em">${q.emoji}</span>` : ''}${esc(q.q)}${q.img ? `<img class="q-img" src="${window.UI.img(q.img)}" alt="">` : ''}</div>
        <div class="quiz-choices">${q.choices.map((c, k) => `<button class="choice" data-k="${k}">${esc(c)}</button>`).join('')}</div>
        <div class="quiz-foot"></div>
      </div>`;
      root.querySelectorAll('.choice').forEach((b) => { b.onclick = () => answer(+b.dataset.k); });
    }

    function answer(k) {
      const q = qs[i];
      const ok = k === q.answer;
      const btns = root.querySelectorAll('.choice');
      btns.forEach((b) => { b.disabled = true; });
      root.querySelector('.quiz-choices').classList.add('answered');
      btns[q.answer].classList.add('ok');
      if (ok) { score++; ctx.hit(); window.FX.sound('ok'); } else { btns[k].classList.add('no'); window.FX.sound('no'); }
      root.querySelector('.quiz-foot').innerHTML = `<div class="verdict">${ok ? '✅ إجابة صحيحة!' : '❌ الإجابة الصحيحة باللون الأخضر'}</div>`;
      ctx.answered(ok, () => {
        i++;
        if (i < qs.length) show(); else done({ score, max: qs.length });
      }, q.why);
    }

  },
});

// sort: a card falls down the screen; tap the right bin before it reaches the bottom.
// Data: { bins: [{ id, label, emoji, color }], items: [{ text, emoji?, bin }], seconds? }
window.GAMES.register('sort', {
  icon: '🧺',
  label: 'صنّف بسرعة',
  render(root, act, done, ctx) {
    const { esc, shuffle } = window.UI;
    const items = shuffle(act.items);
    const secs = act.seconds || 9;
    let i = 0;
    let score = 0;
    let busy = false;

    root.innerHTML = `<div class="game">
      <div class="game-top"><span class="pill" data-count></span><span class="pill">⭐ <b data-score>0</b></span></div>
      <div class="sort-arena"><div class="sort-item"></div></div>

        `<button class="bin" data-bin="${b.id}" style="--bc:${b.color}"><span class="bin-em">${b.emoji || ''}</span>${esc(b.label)}</button>`).join('')}</div>
    </div>`;
    const itemEl = root.querySelector('.sort-item');
    const bins = [...root.querySelectorAll('.bin')];

    function next() {
      bins.forEach((b) => b.classList.remove('flash-ok', 'flash-no'));
      if (i >= items.length) return done({ score, max: items.length });
      const it = items[i];
      busy = false;
      root.querySelector('[data-count]').textContent = `${i + 1} / ${items.length}`;
      itemEl.innerHTML = `${it.emoji ? `<span class="em">${it.emoji}</span>` : ''}${esc(it.text)}`;
      itemEl.className = 'sort-item';
      itemEl.style.animationPlayState = 'running';
      void itemEl.offsetWidth;                  // restart the fall animation
      itemEl.style.animationDuration = secs + 's';
      itemEl.classList.add('falling');
    }

    function judge(binId) {
      busy = true;
      const it = items[i];
      const ok = binId === it.bin;
      itemEl.style.animationPlayState = 'paused';
      itemEl.classList.add(ok ? 'hit-ok' : 'hit-no');
      bins.forEach((b) => {
        if (b.dataset.bin === it.bin) b.classList.add('flash-ok');
        else if (b.dataset.bin === binId) b.classList.add('flash-no');

        score++;

        root.querySelector('[data-score]').textContent = score;
        window.FX.sound('ok');
      } else {
        window.FX.sound('no');
      }
      ctx.answered(ok, () => { i++; next(); });
    }

    itemEl.addEventListener('animationend', () => { if (!busy) judge(null); });
    bins.forEach((b) => { b.onclick = () => { if (!busy) judge(b.dataset.bin); }; });
    next();
  },
});

window.GAMES.register('memory', {
  icon: '🃏',
  label: 'لعبة الذاكرة',
  render(root, act, done, ctx) {
    const { esc, shuffle } = window.UI;
    const P = act.pairs.length;
    const cards = shuffle(act.pairs.flatMap((p, k) => [{ k, side: 'sa', text: p.a }, { k, side: 'sb', text: p.b }]));
    const cols = cards.length <= 12 ? 4 : 5;
    let open = [];
    let moves = 0;
    let found = 0;
    let lock = false;

    root.innerHTML = `<div class="game">
      <div class="game-top"><span class="pill">🔁 <b data-moves>0</b> محاولة</span><span class="pill">✅ <b data-found>0</b> / ${P}</span></div>
      <div class="mem-board" style="--cols:${cols}">${cards.map((c, i) => `
        <button class="mc" data-i="${i}"><span class="in">
          <span class="back">${act.backEmoji || '🤖'}</span>
          <span class="front ${c.side}">${esc(c.text)}</span>
        </span></button>`).join('')}</div>
    </div>`;
    const btns = [...root.querySelectorAll('.mc')];

    btns.forEach((b) => {
      b.onclick = () => {
        const i = +b.dataset.i;
        if (lock || b.classList.contains('flip')) return;
        b.classList.add('flip');
        window.FX.sound('flip');
        open.push(i);
        if (open.length < 2) return;

        moves++;
        root.querySelector('[data-moves]').textContent = moves;
        const [x, y] = open;
        open = [];
        lock = true;
        if (cards[x].k === cards[y].k) {
          btns[x].classList.add('done');
          btns[y].classList.add('done');
          found++;
          ctx.hit();
          root.querySelector('[data-found]').textContent = found;
          window.FX.sound('ok');
          ctx.answered(true, () => {
            lock = false;
            if (found < P) return;
            // Perfect = one try per pair; lose a point for every 2 extra tries.
            done({ score: Math.max(1, Math.min(P, P - Math.floor(Math.max(0, moves - P) / 2))), max: P });
          });
        } else {
          window.FX.sound('no');
          ctx.answered(false, () => {
            btns[x].classList.remove('flip');
            btns[y].classList.remove('flip');
            lock = false;
          });
        }
      };
    });
  },
});
</script>

// Scoreboard: #scoreboard = classes (grouped by grade) → #scoreboard/<classId> = groups with +1 / -1.
window.SCOREBOARD = (function () {
  const { esc } = window.UI;
  const cfg = () => window.DASH_CONFIG;
  const state = () => window.APP.state;
  const save = () => window.APP.save();

  // ---------- data ----------
  function ensureClass(cid) {
    const st = state();
    if (!st.classes[cid]) {
      const c = cfg().classes.find((x) => x.id === cid);
      st.classes[cid] = {
        groups: c.groups.map((g, i) => ({ id: 'g' + (i + 1), name: g.name, emoji: g.emoji, color: g.color, points: 0 })),
      };
    }
    return st.classes[cid];
  }

  function currentClassId() {
    const ids = cfg().classes.map((c) => c.id);
    return ids.includes(state().currentClass) ? state().currentClass : ids[0];
  }
  function setCurrentClass(cid) {
    if (state().currentClass === cid) return;
    state().currentClass = cid;
    save();
  }
  const group = (cid, gid) => ensureClass(cid).groups.find((g) => g.id === gid);
  const classesOfGrade = (grade) => cfg().classes.filter((c) => c.grade === grade);
  const classTotal = (cls) => cls.groups.reduce((s, g) => s + g.points, 0);

  // ---------- actions ----------
  // Adds pts to a group, never below 0. Returns the change actually applied.
  function award(cid, gid, pts) {
    const g = group(cid, gid);
    if (!g) return 0;
    const before = g.points;
    g.points = Math.max(0, g.points + pts);
    const delta = g.points - before;
    save();
    if (delta > 0) window.FX.sound('point');
    else if (delta < 0) window.FX.sound('minus');
    else if (pts < 0) window.FX.sound('blocked');
    return delta;
  }

  function resetClass(cid) {
    delete state().classes[cid];
    ensureClass(cid);
    save();
  }

  // ---------- views ----------
  function render(el, parts) {
    const cid = parts && parts[0];
    if (cfg().classes.some((c) => c.id === cid)) return classPage(el, cid);
    return classesPage(el);
  }

  function classesPage(el) {
    el.innerHTML = `<h1 class="page-title">🏆 لوحة النقاط</h1>
      ${cfg().grades.map((gr) => {
        const list = classesOfGrade(gr.grade);
        if (!list.length) return '';
        return `<section class="grade-sec">
          <h2 class="grade-title" style="--gc:${gr.color}">${esc(gr.title)}</h2>
          <div class="class-grid">${list.map((k) => `
            <button class="class-card" style="--gc:${gr.color}" data-cid="${esc(k.id)}">
              <span class="cc-id" dir="ltr">${esc(k.id)}</span>
              <span class="cc-pts" dir="ltr">${classTotal(ensureClass(k.id))}<small>نقطة</small></span>
            </button>`).join('')}</div>
        </section>`;
      }).join('')}`;

    el.onclick = (e) => {
      const b = e.target.closest('[data-cid]');
      if (b) location.hash = '#scoreboard/' + encodeURIComponent(b.dataset.cid);
    };
  }

  function classPage(el, cid) {
    setCurrentClass(cid);
    const cls = ensureClass(cid);
    el.innerHTML = `<div class="class-head">
        <button class="btn ghost" data-act="back">→ الفصول</button>
        <h1 class="class-title" dir="ltr">${esc(cid)}</h1>
        <span></span>
      </div>
      <div class="group-grid">${cls.groups.map((g) => `
        <article class="gcard" data-gid="${g.id}" style="--gc:${g.color}">
          <div class="gcard-top">
            <span class="g-emoji">${esc(g.emoji)}</span>
            <div class="g-name">${esc(g.name)}</div>
          </div>
          <div class="g-points" dir="ltr">${g.points}</div>
          <div class="g-btns">
            <button class="pbtn plus" data-pts="1" dir="ltr">+1</button>
            <button class="pbtn minus" data-pts="-1" dir="ltr">-1</button>
          </div>
        </article>`).join('')}</div>`;

    el.onclick = (e) => {
      if (e.target.closest('[data-act="back"]')) { location.hash = '#scoreboard'; return; }
      const b = e.target.closest('[data-pts]');
      if (!b) return;
      const gid = b.closest('[data-gid]').dataset.gid;
      const delta = award(cid, gid, +b.dataset.pts);
      classPage(el, cid);
      if (delta) window.UI.pop(el.querySelector(`[data-gid="${gid}"] .g-points`), (delta > 0 ? '+' : '') + delta);
    };
  }

  return { render, award, ensureClass, currentClassId, setCurrentClass, group, classesOfGrade, resetClass };
})();

  function lessonPage(el, grade, unit, lesson) {
    el.innerHTML = `
      <div class="page-title"><a class="btn ghost" href="#activities/${grade.id}">→ ${esc(grade.title)}</a>${unit.emoji} ${esc(lesson.title)}</div>
      <div class="info-grid">
        ${lesson.objectives ? `<div class="info"><h3>🎯 سأتعلم أن:</h3><ul>${lesson.objectives.map((o) => `<li>${esc(o)}</li>`).join('')}</ul></div>` : ''}
        ${lesson.vocabulary ? `<div class="info"><h3>📖 كلمات مهمة</h3><div class="vocab">${lesson.vocabulary.map((v) =>
          `<div><b>${esc(v.term)}:</b> ${esc(v.meaning)}</div>`).join('')}</div></div>` : ''}
      </div>
      ${lesson.figures ? `<h2 class="section-title">📖 من الكتاب</h2>
      <div class="figs">${lesson.figures.map((f, i) => `
        <button class="fig" data-fig="${i}"><img src="${window.UI.img(f.img)}" alt=""><span>${esc(f.caption)}</span></button>`).join('')}
      </div>` : ''}
      <h2 class="section-title">🕹️ الأنشطة</h2>
      <div class="act-grid">
        ${lesson.activities.map((a, i) => {
          const eng = window.GAMES.get(a.type);
          return `<button class="atile" style="--ac:${ACT_COLORS[i % ACT_COLORS.length]}" data-play="${i}">
            <span class="ic">${eng.icon}</span><b>${esc(a.title)}</b><span>${eng.label}</span></button>`;
        }).join('')}
        ${lesson.handsOn ? `<button class="atile" style="--ac:#2A1D66;border:4px dashed var(--yellow)" data-handson>
          <span class="ic">🛠️</span><b>التطبيق العملي</b><span>${esc(lesson.handsOn.goal)}</span></button>` : ''}
      </div>`;

    el.onclick = (e) => {
      const p = e.target.closest('[data-play]');
      if (p) return play(grade, lesson.activities[+p.dataset.play]);
      if (e.target.closest('[data-handson]')) return handsOn(lesson);
      const f = e.target.closest('[data-fig]');
      if (f) { const fig = lesson.figures[+f.dataset.fig]; window.UI.lightbox(fig.img, fig.caption); }
    };
  }

  // ---------- player ----------
  // Groups take turns inside one game: the turns bar sets who is answering now, and every correct
  // answer earns 1 point for the group whose turn it was. "Practice" plays with no groups and no points.
  function play(grade, act) {
    const engine = window.GAMES.get(act.type);
    const { el, close } = window.UI.layer('player');
    const classes = SB().classesOfGrade(grade.grade);
    let cid = classes.some((c) => c.id === SB().currentClassId()) ? SB().currentClassId() : (classes[0] && classes[0].id);
    let gid = null;      // group whose turn it is (null = practice)
    let tally = {};      // gid → correct answers in this game
    let lastHit = null;  // group credited by the answer being shown in the popup
    let popTimer;
    const stop = () => clearTimeout(popTimer);

    // Engine API: hit() when an answer scores; answered(ok, next, note?) after every answer —
    // the game waits until the teacher taps "continue" (and can pick the next group) before next().
    const ctx = {
      hit() {
        if (!gid) return;
        tally[gid] = (tally[gid] || 0) + 1;
        lastHit = gid;
        renderTurns();
        window.UI.pop(el.querySelector('.turn.on'), '+1');
      },
      answered(ok, next, note) {
        el.classList.add('paused');
        popTimer = setTimeout(() => showPop({ ok, note }, next), 700);
      },
    };

    // Popup shown after each answer ({ ok, note }) or on pause ({ pause: true }).
    function showPop(info, onContinue) {
      if (!el.isConnected) return;
      el.classList.add('paused');
      const credited = lastHit ? SB().group(cid, lastHit) : null;
      lastHit = null;
      const box = document.createElement('div');
      box.className = 'p-pop';
      const groupsHtml = () => SB().ensureClass(cid).groups.map((g) => `
        <button class="turn ${g.id === gid ? 'on' : ''}" data-turn="${g.id}" style="--gc:${g.color}">
          <span class="em">${esc(g.emoji)}</span>${esc(g.name)}</button>`).join('');
      box.innerHTML = `<div class="p-pop-card">
        <div class="pop-top">
          <div class="pop-verdict ${info.pause ? '' : info.ok ? 'ok' : 'no'}">${info.pause ? '⏸ متوقف مؤقتًا' : info.ok ? '✅ إجابة صحيحة!' : '❌ إجابة خاطئة'}</div>
          ${credited ? `<div class="pop-credit" style="--gc:${credited.color}"><span class="ltr">+1</span> ${esc(credited.emoji)} ${esc(credited.name)}</div>` : ''}
        </div>
        ${info.note ? `<p class="why">💡 ${esc(info.note)}</p>` : ''}
        <div class="pop-row">
          ${gid ? `<span class="pop-ask">من يجيب الآن؟</span><div class="pop-groups">${groupsHtml()}</div>` : ''}
          <button class="btn big yellow" data-continue>متابعة ◀</button>
        </div>
      </div>`;
      box.onclick = (e) => {
        const t = e.target.closest('[data-turn]');
        if (t) {
          gid = t.dataset.turn;
          window.FX.sound('flip');
          box.querySelector('.pop-groups').innerHTML = groupsHtml();
          renderTurns();
          return;
        }
        if (e.target.closest('[data-continue]')) {
          box.remove();
          el.classList.remove('paused');
          onContinue();
        }
      };
      el.appendChild(box);
    }

    function frame(withTurns, inGame) {
      el.innerHTML = `<header class="p-hud">
          <button class="btn ghost" data-exit>✕ خروج</button>
          <div class="p-title">${engine.icon} ${esc(act.title)}</div>
          ${inGame ? '<button class="btn ghost" data-pause>⏸ إيقاف مؤقت</button>' : '<span></span>'}
        </header>
        ${withTurns ? '<nav class="turns"></nav>' : ''}
        <main class="p-body"></main>`;
      el.classList.remove('paused');
      el.querySelector('[data-exit]').onclick = () => { stop(); close(); };
      const pause = el.querySelector('[data-pause]');
      if (pause) pause.onclick = () => { if (!el.classList.contains('paused')) showPop({ pause: true }, () => {}); };
      if (withTurns) {
        renderTurns();
        el.querySelector('.turns').onclick = (e) => {
          const b = e.target.closest('[data-turn]');
          if (!b || b.dataset.turn === gid) return;
          gid = b.dataset.turn;
          window.FX.sound('flip');
          renderTurns();
        };
      }
      return el.querySelector('.p-body');
    }

    function renderTurns() {
      const bar = el.querySelector('.turns');
      if (!bar) return;
      bar.innerHTML = `<span class="turns-label">الدور:</span>${SB().ensureClass(cid).groups.map((g) => `
        <button class="turn ${g.id === gid ? 'on' : ''}" data-turn="${g.id}" style="--gc:${g.color}">
          <span class="em">${esc(g.emoji)}</span>${esc(g.name)}<b class="tally">✓ ${tally[g.id] || 0}</b>
        </button>`).join('')}`;
    }

    function pickGroup() {
      gid = null;
      tally = {};
      const body = frame(false);
      const groups = cid ? SB().ensureClass(cid).groups : [];
      body.innerHTML = `<div class="pick">
        <h2>من يبدأ؟ 🙋</h2>
        <p class="muted">بدّلوا الدور من الشريط أعلى اللعبة. كل إجابة صحيحة = نقطة للمجموعة صاحبة الدور.</p>
        <div class="row center">${classes.map((c) =>
          `<button class="ctab ${c.id === cid ? 'active' : ''}" data-cid="${c.id}">${c.id}</button>`).join('')}</div>
        <div class="pick-groups">${groups.map((g) =>
          `<button class="pick-g" style="--gc:${g.color}" data-gid="${g.id}"><span class="em">${esc(g.emoji)}</span>${esc(g.name)}</button>`).join('')}</div>
        <div><button class="btn big ghost" data-practice>🎯 تدريب بدون نقاط</button></div>
      </div>`;
      body.onclick = (e) => {
        const c = e.target.closest('[data-cid]');
        if (c) { cid = c.dataset.cid; SB().setCurrentClass(cid); return pickGroup(); }
        const g = e.target.closest('[data-gid]');
        if (g) { gid = g.dataset.gid; return start(); }
        if (e.target.closest('[data-practice]')) start();
      };
    }

    function start() {
      const body = frame(!!gid, true);
      engine.render(body, act, finish, ctx);
    }

    function finish({ score, max }) {
      stop();
      el.querySelectorAll('.p-pop').forEach((p) => p.remove());
      const ratio = max ? score / max : 0;
      const stars = ratio >= 0.9 ? 3 : ratio >= 0.6 ? 2 : score > 0 ? 1 : 0;
      const played = !!gid;
      const rows = !played ? [] : SB().ensureClass(cid).groups.filter((g) => tally[g.id]).sort((a, b) => tally[b.id] - tally[a.id]);
      const body = frame(false);
      body.innerHTML = `<div class="result">
        <h2>${['حاولوا مرة أخرى 💪', 'جيد! 👍', 'رائع جدًا! 🌟', 'ممتاز! 🏆'][stars]}</h2>
        <div class="stars-big">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
        <div class="score">${score} / ${max}</div>
        ${act.answerImg ? `<p>📖 هكذا في الكتاب:</p><img class="answer-img" src="${window.UI.img(act.answerImg)}" alt="">` : ''}
        ${played && rows.length ? `<div class="earned">${rows.map((g) => `
          <div class="earn-row" style="--gc:${g.color}"><span class="em">${esc(g.emoji)}</span><b>${esc(g.name)}</b>
            <span>✓ ${tally[g.id]} إجابة صحيحة</span><span class="pill-pts">+${tally[g.id]}</span></div>`).join('')}</div>
          <button class="btn big green" data-award>✅ أضف النقاط للمجموعات</button>` : ''}
        ${played && !rows.length ? '<p>لا إجابات صحيحة هذه المرة 💪</p>' : ''}
        <div class="row center">
          <button class="btn big" data-again>🔁 العبوا مرة أخرى</button>
          <button class="btn big ghost" data-exit2>↩ رجوع للدرس</button>
        </div>
      </div>`;
      if (stars === 3) { window.FX.sound('win'); window.FX.confetti(); }
      const award = body.querySelector('[data-award]');
      if (award) {
        award.onclick = () => {
          rows.forEach((g) => SB().award(cid, g.id, tally[g.id]));
          award.disabled = true;
          award.textContent = '✔ تمت إضافة النقاط';
          window.UI.pop(award, '+' + rows.reduce((s, g) => s + tally[g.id], 0));
        };
      }
      body.querySelector('[data-again]').onclick = pickGroup;
      body.querySelector('[data-exit2]').onclick = close;
    }

    if (classes.length) pickGroup(); else start();
  }

  // ---------- hands-on step viewer ----------
  function handsOn(lesson) {
    const h = lesson.handsOn;
    const { el, close } = window.UI.layer('player');
    const total = h.steps.length + 1;   // + final checklist screen
    let i = 0;
    const checked = new Set();

    function show() {
      const last = i === h.steps.length;
      const s = h.steps[i];
      el.innerHTML = `<header class="p-hud">
          <button class="btn ghost" data-exit>✕ خروج</button>
          <div class="p-title">🛠️ التطبيق العملي</div><span></span>
        </header>
        <main class="p-body"><div class="steps">
          <div class="step-goal">🎯 ${esc(h.goal)}</div>
          ${last ? `
            <h2 class="center-text">✅ هل أنجزت؟</h2>
            <div class="check-list">${(h.checklist || []).map((c, k) =>
              `<button class="check ${checked.has(k) ? 'on' : ''}" data-k="${k}">${checked.has(k) ? '✅' : '⬜'} ${esc(c)}</button>`).join('')}</div>
            ${h.challenge ? `<div class="challenge">🚀 تحدٍّ إضافي: ${esc(h.challenge)}</div>` : ''}`
          : `
            <div class="step-card"><span class="step-num">${i + 1}</span>
              <div><div class="step-text">${esc(s.text)}</div>${s.tip ? `<div class="step-tip">💡 ${esc(s.tip)}</div>` : ''}
                ${s.img ? `<img class="step-img" data-zoom="${s.img}" src="${window.UI.img(s.img)}" alt="">` : ''}</div>
            </div>`}
          <div class="step-dots">${Array.from({ length: total }, (_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>
          <div class="step-nav">
            <button class="btn big ghost" data-prev ${i === 0 ? 'disabled' : ''}>السابق ▶</button>
            ${last ? '<button class="btn big green" data-exit>🏁 إنهاء</button>'
                   : `<button class="btn big yellow" data-next>${i + 1 === h.steps.length ? 'قائمة التحقق ✅' : 'التالي ◀'}</button>`}
          </div>
        </div></main>`;
    }

    el.onclick = (e) => {
      if (e.target.closest('[data-exit]')) return close();
      const z = e.target.closest('[data-zoom]');
      if (z) return window.UI.lightbox(z.dataset.zoom);
      if (e.target.closest('[data-next]')) { i = Math.min(total - 1, i + 1); return show(); }
      if (e.target.closest('[data-prev]')) { i = Math.max(0, i - 1); return show(); }
      const c = e.target.closest('[data-k]');
      if (c) {
        const k = +c.dataset.k;
        if (checked.has(k)) checked.delete(k); else { checked.add(k); window.FX.sound('ok'); }
        if (checked.size === (h.checklist || []).length) window.FX.confetti();
        show();
      }
    };
    show();
  }

  return { render };
})();
</script>
  <script>/* js/settings.js */
// ⚙️ Settings: backup export/import, rename groups, manual reset (new term).
window.SETTINGS = {
  open() {
    const { esc } = window.UI;
    const SB = window.SCOREBOARD;
    const cid = SB.currentClassId();
    const cls = SB.ensureClass(cid);

    const m = window.UI.modal(`
      <h2>⚙️ الإعدادات</h2>
      <section class="set-sec">
        <h3>💾 النسخ الاحتياطي</h3>
        <p class="muted">النقاط محفوظة في هذا المتصفح على هذا الجهاز فقط. صدّر نسخة كل أسبوع.</p>
        <div class="row">
          <button class="btn" data-x="export">⬇️ تصدير نسخة</button>
          <label class="btn ghost">⬆️ استيراد نسخة<input type="file" accept=".json,application/json" hidden data-x="import"></label>
        </div>
      </section>
      <section class="set-sec">
        <h3>✏️ أسماء مجموعات الفصل <span class="ltr">${esc(cid)}</span></h3>
        ${cls.groups.map((g) => `
          <div class="row">
            <input class="in emoji" data-gid="${g.id}" data-f="emoji" value="${esc(g.emoji)}" maxlength="4">
            <input class="in" data-gid="${g.id}" data-f="name" value="${esc(g.name)}" maxlength="24">
          </div>`).join('')}
        <div><button class="btn green" data-x="names">💾 حفظ الأسماء</button></div>
      </section>
      <section class="set-sec">
        <h3>🔄 بداية فترة جديدة</h3>
        <p class="muted">يصفّر النقاط. لا يمكن التراجع، لذا صدّر نسخة أولًا.</p>
        <div class="row">
          <button class="btn danger" data-x="reset-class">تصفير الفصل <span class="ltr">${esc(cid)}</span></button>
          <button class="btn danger" data-x="reset-all">تصفير كل الفصول</button>
        </div>
      </section>`, { wide: true });

    const done = (msg) => { m.close(); window.UI.toast(msg); window.APP.refresh(); };

    m.el.querySelector('[data-x="export"]').onclick = () => window.STORE.exportBackup(window.APP.state);

    m.el.querySelector('[data-x="import"]').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      window.STORE.importBackup(file)
        .then(() => location.reload())
        .catch((err) => window.UI.toast('❌ ملف غير صالح: ' + err.message));
    };

    m.el.querySelector('[data-x="names"]').onclick = () => {
      m.el.querySelectorAll('input[data-gid]').forEach((inp) => {
        const g = SB.group(cid, inp.dataset.gid);
        const v = inp.value.trim();
        if (g && v) g[inp.dataset.f] = v;
      });
      window.APP.save();
      done('✅ تم حفظ الأسماء');
    };

    m.el.querySelector('[data-x="reset-class"]').onclick = () => {
      window.UI.confirmBox(`تصفير كل نقاط الفصل <span class="ltr">${esc(cid)}</span>؟`, 'نعم، صفّر', () => {
        SB.resetClass(cid);
        done('🔄 تم تصفير الفصل ' + cid);
      }, true);
    };

    m.el.querySelector('[data-x="reset-all"]').onclick = () => {
      window.UI.confirmBox('تصفير كل الفصول؟ ستُحذف كل النقاط.', 'نعم، صفّر الكل', () => {
        window.DASH_CONFIG.classes.forEach((c) => SB.resetClass(c.id));
        done('🔄 تم تصفير كل الفصول');
      }, true);
    };
  },
};
</script>
  <script>/* js/app.js */
// Boot + hash router: #scoreboard, #activities, #activities/<gradeId>, #activities/<gradeId>/<lessonId>.
(function () {
  const views = { scoreboard: window.SCOREBOARD, activities: window.ACTIVITIES };
  const viewEl = document.getElementById('view');
  const state = window.STORE.load();

  window.APP = { state, save: () => window.STORE.save(state) };
  window.EDITOR.apply();   // swap teacher's saved text edits into the curriculum data before rendering
  window.FX.muted = !!state.settings.muted;
  document.getElementById('app-title').textContent = window.DASH_CONFIG.appTitle;

  const muteBtn = document.getElementById('btn-mute');
  const syncMute = () => { muteBtn.textContent = window.FX.muted ? '🔇' : '🔊'; };
  syncMute();

  function route() {
    const parts = location.hash.slice(1).split('/').filter(Boolean).map(decodeURIComponent);
    const name = views[parts[0]] ? parts[0] : 'scoreboard';
    viewEl.onclick = null;
    views[name].render(viewEl, parts.slice(1));
    document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.route === name));
  }
  window.APP.refresh = route;

  document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => { location.hash = t.dataset.route; }));
  muteBtn.addEventListener('click', () => {
    state.settings.muted = window.FX.muted = !window.FX.muted;
    syncMute();
    window.APP.save();
  });
  // Fullscreen is blocked when the file is shown inside another app's preview window: say so instead of
  // failing silently (F11 always works in Edge/Chrome).
  const fullBtn = document.getElementById('btn-full');
  const noFullscreen = () => window.UI.toast('ملء الشاشة غير متاح هنا: افتح الملف في Edge أو Chrome، أو اضغط F11');
  fullBtn.addEventListener('click', () => {
    if (!document.fullscreenEnabled) return noFullscreen();
    const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    if (p && p.catch) p.catch(noFullscreen);
  });
  document.addEventListener('fullscreenchange', () => {
    fullBtn.textContent = document.fullscreenElement ? '🗗' : '⛶';
    fullBtn.title = document.fullscreenElement ? 'خروج من ملء الشاشة' : 'ملء الشاشة';
  });
  document.getElementById('btn-settings').addEventListener('click', () => window.SETTINGS.open());
  document.getElementById('btn-edit').addEventListener('click', () => window.EDITOR.open());

  window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });
  window.UI.watchBidi(document.body);
  route();
})();
</script>
